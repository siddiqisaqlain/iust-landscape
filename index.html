<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IUST Campus Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive 3D landscape master plan for the IUST Awantipora campus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D site model fills the screen like a model on a table; the controls float on frosted panels at its edges. */
:root{
  --ink:#1d2620; --ink2:#55605a; --ink3:#8a948d;
  --panel:rgba(250,248,242,.82); --panel-strong:rgba(250,248,242,.94); --rule:rgba(29,38,32,.12); --fill:rgba(29,38,32,.06);
  --chinar:#b4462a; --water:#3f7896; --leaf:#3f6b4a; --stage:#dfe3dc;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#eef0ea; --ink2:#b3bbb3; --ink3:#7f8a82; --panel:rgba(24,29,26,.78); --panel-strong:rgba(24,29,26,.93); --rule:rgba(238,240,234,.14); --fill:rgba(238,240,234,.08);
  --chinar:#e07a55; --water:#7fb6d4; --leaf:#8fc29c; --stage:#1a1f1c; color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#eef0ea; --ink2:#b3bbb3; --ink3:#7f8a82; --panel:rgba(24,29,26,.78); --panel-strong:rgba(24,29,26,.93); --rule:rgba(238,240,234,.14); --fill:rgba(238,240,234,.08);
  --chinar:#e07a55; --water:#7fb6d4; --leaf:#8fc29c; --stage:#1a1f1c; color-scheme:dark }
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--stage);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--rule);box-shadow:0 12px 40px -12px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--chinar);outline-offset:2px}

/* title + mode */
.head{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:300px;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.head small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.head h1{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.02;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--fill);gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--panel-strong);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* places */
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 360px);overflow:auto}
.places button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 6px;border-radius:10px;text-align:left;font-size:14px;font-weight:500}
.places button:hover,.places button[aria-current="true"]{background:var(--fill)}
.places b{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--chinar);color:#fff;font-size:11px;font-weight:700}
.places .w b{background:var(--water)}

/* bottom controls */
.bar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;padding:8px 10px 8px 8px;border-radius:999px;max-width:calc(100% - 32px)}
.bar .seg{background:var(--fill)}
.bar .seg button{padding:8px 12px}
.time{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.time input{width:160px;accent-color:var(--chinar)}
.time output{width:44px;color:var(--ink)}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--ink);color:var(--stage);padding:9px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.ibtn.ghost{background:var(--fill);color:var(--ink)}
.ibtn svg{width:14px;height:14px}

/* place card */
.card{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:340px;border-radius:18px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;
  transform:translateX(calc(100% + 32px));transition:transform .5s var(--ease)}
.card.on{transform:none}
.card .k{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--chinar)}
.card .x{border:0;background:var(--fill);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.card h2{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.card .now{font-size:13px;color:var(--ink3);border-top:1px solid var(--rule);padding-top:10px}
.card .facts{display:flex;flex-wrap:wrap;gap:6px}
.card .facts span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--fill);color:var(--ink2)}

/* labels over the model */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lab{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;border:0;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:auto;
  background:var(--panel-strong);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.2);transition:opacity .3s}
.lab b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--chinar);color:#fff;font-size:11px}
.lab.w b{background:var(--water)}
.lab.dim{opacity:.35}
.lab.hide{opacity:0;pointer-events:none}

.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--ink2);padding:6px 12px;border-radius:999px;transition:opacity .6s}
.load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--stage);transition:opacity .8s,visibility .8s}
.load.done{opacity:0;visibility:hidden}
.load p{font-family:var(--f-display);font-size:22px;color:var(--ink2)}
.credit{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;font-size:10.5px;color:var(--ink2);max-width:30ch;line-height:1.4;padding:6px 10px;border-radius:10px;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media (max-width:1300px){.credit{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* author, visitors and chat (top right; steps aside while a place card is open) */
.social{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:300px;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:opacity .35s,visibility .35s}
.card.on ~ .social{opacity:0;visibility:hidden}
.social .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.social small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.social strong{display:block;font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.15;margin-top:2px}
.vline{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.vline[hidden]{display:none}
.vline i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s infinite}
.vline .sep{color:var(--ink3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.chat-t{position:relative;flex:none}
.chat-t[hidden]{display:none}
.chat-t b{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--chinar);color:#fff;font-size:10px;line-height:17px;text-align:center}
.chat-t b[hidden]{display:none}
.chat{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.chat[hidden]{display:none}
.msgs{list-style:none;margin:0;padding:0 2px 0 0;display:flex;flex-direction:column;gap:9px;max-height:min(300px,40vh);overflow:auto;overscroll-behavior:contain}
.msgs li{font-size:13.5px;line-height:1.45}
.msgs .meta{display:flex;align-items:baseline;gap:6px}
.msgs .meta b{font-weight:600;font-size:12.5px;color:var(--ink)}
.msgs .meta time{font-size:11px;color:var(--ink3)}
.msgs p{margin:1px 0 0;color:var(--ink2);overflow-wrap:anywhere;white-space:pre-wrap}
.msgs .empty{color:var(--ink3);font-size:13px}
.chat form{display:flex;flex-direction:column;gap:6px}
.chat input{font:inherit;font-size:13.5px;color:var(--ink);background:var(--fill);border:1px solid transparent;border-radius:10px;padding:8px 10px;min-width:0}
.chat input:focus{outline:none;border-color:var(--chinar)}
.chat .row{display:flex;gap:6px}
.chat .row input{flex:1}
.chat .send{flex:none;width:36px;border:0;border-radius:10px;background:var(--ink);color:var(--stage);display:grid;place-items:center}
.chat .send:disabled{opacity:.5;cursor:default}
.chat .send svg{width:14px;height:14px}
.chat-err{margin:0;font-size:12px;color:var(--chinar)}
.chat-err[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.vline i{animation:none}.social{transition:none}}
.compass{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.compass svg{width:26px;height:26px}

@media (max-width:760px){
  .credit{display:none}
  .head{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:12px 14px;gap:8px}
  .head h1{font-size:22px}
  .places{flex-direction:row;overflow-x:auto;max-height:none;gap:4px;scrollbar-width:none}
  .places button{white-space:nowrap;padding:5px 8px;background:var(--fill)}
  .bar{flex-wrap:wrap;justify-content:center;border-radius:20px;gap:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .time input{width:110px}
  .card{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;transform:translateY(calc(100% + 200px))}
  .card.on{transform:none}
  .hint,.compass{display:none}
  .social{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:auto;max-width:calc(100% - 32px);padding:10px 12px;gap:8px}
  .social strong{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.card,.load{transition:none}}
</style>

<canvas id="scene" tabindex="0" aria-label="3D model of the IUST Awantipora campus and its landscape design. Drag to turn, scroll or pinch to zoom, right-drag to pan."></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="head glass">
  <div><small>IUST Awantipora · landscape master plan</small><h1>A Campus Garden of the Karewa</h1></div>
  <div class="seg" role="group" aria-label="Show the campus">
    <button type="button" id="mExist" aria-pressed="false">Today</button>
    <button type="button" id="mProp" aria-pressed="true">Proposed</button>
  </div>
  <ul class="places" id="places" aria-label="Places in the plan"></ul>
</header>

<aside class="card glass" id="card" aria-live="polite">
  <div class="k"><span id="cK"></span><button class="x" type="button" id="cX" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.8"><path d="M1 1l8 8M9 1L1 9"/></svg></button></div>
  <h2 id="cT"></h2>
  <p id="cP"></p>
  <div class="facts" id="cF"></div>
  <p class="now" id="cN"></p>
</aside>

<section class="social glass" aria-label="Author, visitors and chat">
  <div class="top">
    <div><small>Plan and design</small><strong>Saqlain Siddiqi</strong></div>
    <button class="ibtn ghost chat-t" type="button" id="chatT" aria-expanded="false" aria-controls="chat" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg><span>Chat</span><b id="chatN" hidden></b></button>
  </div>
  <p class="vline" id="vLine" hidden><i aria-hidden="true"></i><span id="vNow"></span><span class="sep" id="vSep" hidden>·</span><span id="vAll"></span></p>
  <div class="chat" id="chat" hidden>
    <ol class="msgs" id="msgs" aria-live="polite"><li class="empty">Loading messages…</li></ol>
    <form id="chatF">
      <input id="chatName" name="name" placeholder="Your name" maxlength="40" required autocomplete="nickname" aria-label="Your name">
      <div class="row">
        <input id="chatMsg" name="message" placeholder="Say something about the plan…" maxlength="500" required autocomplete="off" aria-label="Message">
        <button class="send" type="submit" id="chatS" aria-label="Send"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5l12 5.5-12 5.5 2-5.5z"/></svg></button>
      </div>
      <p class="chat-err" id="chatErr" role="alert" hidden></p>
    </form>
  </div>
</section>

<div class="bar glass" role="group" aria-label="Season and time">
  <div class="seg" id="seasons" role="group" aria-label="Season">
    <button type="button" data-s="spring" aria-pressed="false">Spring</button>
    <button type="button" data-s="summer" aria-pressed="false">Summer</button>
    <button type="button" data-s="autumn" aria-pressed="true">Autumn</button>
    <button type="button" data-s="winter" aria-pressed="false">Winter</button>
  </div>
  <label class="time" for="hour"><span>Time</span><input type="range" id="hour" min="5" max="21" step="0.05" value="16.5"><output id="hourOut">16:30</output></label>
  <button class="ibtn ghost" type="button" id="live" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span>Day cycle</span></button>
  <button class="ibtn" type="button" id="tour"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg><span>Guided tour</span></button>
</div>
<p class="hint glass" id="hint">Drag to turn · scroll to zoom · right-drag to pan · click a place</p>
<div class="compass glass" aria-hidden="true"><svg id="needle" viewBox="0 0 26 26"><path d="M13 2l4 11h-8z" fill="var(--chinar)"/><path d="M13 24l4-11h-8z" fill="var(--ink3)"/></svg></div>
<div class="load" id="load"><p id="loadMsg">Laying out the campus…</p></div>
<p class="credit" id="credit">Plan and design: Saqlain Siddiqi</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Visitors and chat: people here now (Supabase Realtime presence), total visits (count_visit), and a shared chat (chat_messages). Each part stays hidden if it cannot load.
(function(){
'use strict';
const SUPABASE_URL = 'https://wllzcxvwurpartbimyle.supabase.co', SUPABASE_KEY = 'sb_publishable_grUMltwmRtBDoRgW-Dxvcw_jjdWrJbW', PAGE = 'iust-landscape';
if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return;
const $ = id => document.getElementById(id), fmt = n => n.toLocaleString('en-IN');
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; };
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
let me = store('iust-visitor'); if (!me) { me = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)); store('iust-visitor', me); }
let fresh = true; try { fresh = !sessionStorage.getItem('iust-counted'); sessionStorage.setItem('iust-counted', '1'); } catch (e) {}

// visitors
const show = () => { $('vLine').hidden = false; $('vSep').hidden = !($('vNow').textContent && $('vAll').textContent); };
const room = db.channel('online:' + PAGE, { config: { presence: { key: me } } });
room.on('presence', { event: 'sync' }, () => { const n = Object.keys(room.presenceState()).length; $('vNow').textContent = n + ' here now'; show(); })
  .subscribe(status => { if (status === 'SUBSCRIBED') room.track({ since: Date.now() }); });
db.rpc('count_visit', { page: PAGE, bump: fresh }).then(({ data, error }) => { if (error || data == null) return; $('vAll').textContent = fmt(data) + (data === 1 ? ' visit' : ' visits'); show(); });

// chat
const seen = new Set(), list = $('msgs');
let open = false, unread = 0;
const ago = t => { const s = (Date.now() - new Date(t)) / 1000;
  return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
const add = (m, mine) => { if (!m || seen.has(m.id)) return; seen.add(m.id);
  const empty = list.querySelector('.empty'); if (empty) empty.remove();
  const atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  const li = document.createElement('li'), meta = document.createElement('div'), who = document.createElement('b'), when = document.createElement('time'), body = document.createElement('p');
  meta.className = 'meta'; who.textContent = m.name; when.dateTime = m.created_at; when.textContent = ago(m.created_at); body.textContent = m.body;
  meta.append(who, when); li.append(meta, body); list.append(li);
  while (list.children.length > 100) list.firstElementChild.remove();
  if (atEnd || mine) list.scrollTop = list.scrollHeight;
  if (!open && !mine) { unread++; $('chatN').textContent = unread > 9 ? '9+' : unread; $('chatN').hidden = false; } };
const setEmpty = t => { list.innerHTML = ''; const li = document.createElement('li'); li.className = 'empty'; li.textContent = t; list.append(li); };
db.from('chat_messages').select('id,name,body,created_at').eq('page', PAGE).order('id', { ascending: false }).limit(50)
  .then(({ data, error }) => { if (error) return; $('chatT').hidden = false;
    if (!data.length) setEmpty('No messages yet. Say hello.'); else data.reverse().forEach(m => add(m, true)); unread = 0; });
db.channel('chat:' + PAGE).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: 'page=eq.' + PAGE }, p => add(p.new)).subscribe();
setInterval(() => list.querySelectorAll('time').forEach(t => { t.textContent = ago(t.dateTime); }), 60000);
$('chatT').addEventListener('click', () => { open = !open; $('chat').hidden = !open; $('chatT').setAttribute('aria-expanded', open);
  if (open) { unread = 0; $('chatN').hidden = true; list.scrollTop = list.scrollHeight; ($('chatName').value ? $('chatMsg') : $('chatName')).focus(); } });
$('chatName').value = store('iust-chat-name') || '';
$('chatF').addEventListener('submit', async e => { e.preventDefault();
  const name = $('chatName').value.trim(), text = $('chatMsg').value.trim(); if (!name || !text) return;
  store('iust-chat-name', name); $('chatS').disabled = true; $('chatErr').hidden = true;
  const { data, error } = await db.from('chat_messages').insert({ page: PAGE, name, body: text }).select('id,name,body,created_at').single();
  if (error) { $('chatErr').textContent = /busy/i.test(error.message) ? 'Chat is busy, try again in a minute.' : 'Could not send. Try again.'; $('chatErr').hidden = false; }
  else { $('chatMsg').value = ''; add(data, true); }
  setTimeout(() => { $('chatS').disabled = false; }, 1500); });
// keep typing in the chat from steering the model
['keydown', 'keyup'].forEach(t => $('chat').addEventListener(t, e => e.stopPropagation()));
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
'use strict';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- the site, in metres ----------
   Traced from satellite imagery at 0.68 m per traced pixel; x runs east, z runs south, origin near the campus centre.
   The ground rises east toward the Wastarwan hills. */
/* The traced plan is in screen pixels of a satellite view centred on 33.9255° N, 75.0187° E at web-map zoom 16.6;
   converting through Web Mercator puts it exactly on the aerial imagery and terrain tiles. */
const LAT0 = 33.9255, LNG0 = 75.0187, CIRC = 40075016.686, COS0 = Math.cos(LAT0 * Math.PI / 180);
const PX = CIRC * COS0 / (512 * Math.pow(2, 16.6)), toM = (px, py) => [(px - 720) * PX, (py - 406) * PX];
const W = 2400, D = 1800;                       // the modelled ground, metres
const tileXY = (lng, lat, z) => { const n = Math.pow(2, z), y = Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));

function stopTour(){ clearTimeout(tourT); tourT = null; $('tour').querySelector('span').textContent = 'Guided tour'; }

$('tour').addEventListener('click', () => { if (tourT) { stopTour(); return; } tourI = current ? PLACES.indexOf(current) + 1 : 0; $('tour').querySelector('span').textContent = 'Stop tour'; stepTour(); });

// clicking the ground near a place opens it
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; fly = null; if (tourT) stopTour(); });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return; down = null;
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(ground)[0]; if (!hit) return;
  let best = null, bd = 1e9; PLACES.forEach(p => { const d = Math.hypot(hit.point.x - p.pos.x, hit.point.z - p.pos.z); if (d < bd) { bd = d; best = p; } });
  if (best && bd < Math.max(40, best.d * .35)) go(best);
});

/* ---------- loop ---------- */
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const v = new THREE.Vector3(); let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; U.time.value = now / 1000;
  if (live){ hour += dt * .35; if (hour > 21) hour = 5; $('hour').value = hour; light(); }
  if (fly){ const k = Math.min(1, (now - fly.start) / fly.ms), e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (k >= 1) fly = null; }
  else if (!current && !reduced && !down) { const a = dt * .02, p = camera.position.clone().sub(controls.target); p.applyAxisAngle(new THREE.Vector3(0, 1, 0), a); camera.position.copy(controls.target).add(p); }
  controls.update(); skyDome.position.copy(camera.position);
  if (!reduced) flowTex.offset.y -= dt * .35;
  // walkers and cars
  const speedUp = 2.2;
  walkers.forEach((w, i) => { const p = w.set[w.path]; w.d += w.v * dt * speedUp; if (w.d > w.L) w.d -= w.L; if (w.d < 0) w.d += w.L;
    const q = at(p, w.d), x = q[0] + w.off, z = q[1] + w.off * .6; o3.position.set(x, H(x, z) + .85, z); o3.rotation.set(0, 0, 0); o3.scale.set(1, 1, 1); o3.updateMatrix(); people.setMatrixAt(i, o3.matrix); });
  people.instanceMatrix.needsUpdate = true;
  carState.forEach((c, i) => { const path = c.loop ? LOOPm : HWd, L = c.loop ? LOOPL : HWL; c.d = (c.d + c.v * dt + L) % L;
    const q = at(path, c.d), q2 = at(path, (c.d + Math.sign(c.v) * 3 + L) % L), lane = c.loop ? 1.6 : 4.5 * Math.sign(c.v);
    const ang = Math.atan2(q2[1] - q[1], q2[0] - q[0]), x = q[0] + Math.sin(ang) * lane, z = q[1] - Math.cos(ang) * lane;
    o3.position.set(x, H(x, z) + .9, z); o3.rotation.set(0, -ang, 0); o3.scale.set(1, 1, 1); o3.updateMatrix(); cars.setMatrixAt(i, o3.matrix); });
  cars.instanceMatrix.needsUpdate = true;
  if (fall.visible){ const n = fall.userData.n || 0; for (let i = 0; i < NF; i++){ const k = i * 3;
      fpos[k+1] -= fv[i] * dt * (season === 'winter' ? 9 : 4); fpos[k] += Math.sin(now / 900 + i) * dt * 2 * (1 - n * .5);
      if (fpos[k+1] < H(fpos[k], fpos[k+2])) fpos[k+1] = 120 + rnd() * 50; }
    fg.attributes.position.needsUpdate = true; }
  renderer.render(scene, camera);
  // labels
  const W2 = innerWidth / 2, H2 = innerHeight / 2;
  labels.forEach(l => { v.copy(l.p.pos).project(camera); const off = v.z > 1;
    l.el.classList.toggle('hide', off); if (!off) l.el.style.transform = `translate(${v.x * W2 + W2}px,${-v.y * H2 + H2}px) translate(-50%,-100%)`; });
  $('needle').style.transform = `rotate(${Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z) * 180 / Math.PI}deg)`;
}
$('credit').textContent = (PHOTO ? 'Imagery: Esri, Maxar, Earthstar Geographics · ' : '') + (TERRAIN ? 'Terrain: Mapzen / AWS Terrain Tiles · ' : '') + 'Plan and design: Saqlain Siddiqi';
let saved = null; try { saved = localStorage.getItem('iust-season'); } catch (e) {}
setSeason(GROUND[saved] ? saved : 'autumn');
requestAnimationFrame(frame);
requestAnimationFrame(() => setTimeout(() => $('load').classList.add('done'), 300));
setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
const start = PLACES.find(p => '#' + p.id === location.hash); if (start) setTimeout(() => go(start), 600);
})();
</script>
